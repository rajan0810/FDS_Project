# QASPER Dataset Configuration
MAX_PAPERS_DEMO: 10
MAX_QUESTIONS_DEMO: 20
MAX_PAPERS_EXP: 100
MAX_QUESTIONS_EXP: 200

# Random Seed for Reproducibility
RANDOM_SEED: 42

# Chunking Configuration
CHUNK_SIZE_TOKENS: 500
CHUNK_OVERLAP_TOKENS: 50

# Embedding Configuration
EMBEDDING_MODEL: "sentence-transformers/all-MiniLM-L6-v2"

# Retrieval & Redundancy Configuration
REDUNDANCY_THRESHOLD: 0.85
MIN_CHUNKS: 1
MAX_CHUNKS: 10
MIN_RELEVANCE_SCORE: 0.30
MARGINAL_SCORE_THRESHOLD: 0.05

# Gemini Configuration
DEFAULT_GEMINI_MODEL: "gemini-3.1-pro-preview"

# Reranking Configuration
RERANK_MODEL: "cross-encoder/ms-marco-MiniLM-L-6-v2"
RERANK_TOP_N: 15

# Experiment Sweep Configuration (Context-vs-Accuracy / Latency / Cost-Quality Tradeoff)
CONTEXT_SIZE_SWEEP: [2, 4, 6, 10]
EXPERIMENT_NUM_SAMPLES: 20
